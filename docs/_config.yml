# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: Meta DFM
description: The engineering and functional-modeling framework of Drayker — the DFM protocols formalized, and the cognitive swarms that apply them.

dk_kicker: Engineering and research
dk_subdomain: metadfmp.drayker.org
dk_repo: https://github.com/draykerdk/metadfmp

defaults:
  - scope:
      path: ""
    values:
      layout: default
