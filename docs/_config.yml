# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

# Set explicitly: GitHub Pages derives site.url without TLS when the certificate is
# terminated upstream, which leaves absolute URLs in meta tags on http. Everything the
# sitemap and the social cards emit has to be the canonical https address.
url: "https://metadfmp.drayker.org"

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

title: "Meta DFM"
description: "Study and improve the method through explicit models. Meta DFM is the evolutionary application of DFM to Drayker's own engineering: research and modelling that look for better versions of the method, the components and the architecture. It is designed as an evolutionary research and development super-agent."

dk_kicker: "Engineering and research"
dk_subdomain: "metadfmp.drayker.org"
dk_repo: "https://github.com/draykerdk/metadfmp"

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#FFCB6B"
